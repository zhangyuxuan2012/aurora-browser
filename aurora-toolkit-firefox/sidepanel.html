<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f7f8fa; color: #333; font-size: 13px; }
    .tk-header { background: linear-gradient(135deg, #4285f4, #34a853); color: #fff; padding: 12px 14px; }
    .tk-header h1 { font-size: 15px; font-weight: 600; }
    .tk-header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }

    .tk-tabs { display: flex; background: #fff; border-bottom: 1px solid #e8e8e8; }
    .tk-tab { flex: 1; text-align: center; padding: 10px 4px; font-size: 12px; cursor: pointer; color: #666; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tk-tab.active { color: #4285f4; border-bottom-color: #4285f4; font-weight: 600; }

    .tk-panel { display: none; padding: 12px; }
    .tk-panel.active { display: block; }

    /* 总结面板 */
    .tk-summary-title { font-size: 12px; color: #888; margin-bottom: 6px; }
    .tk-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .tk-btn-primary { background: #4285f4; color: #fff; }
    .tk-btn-primary:hover { background: #3b78e7; }
    .tk-btn-green { background: #34a853; color: #fff; }
    .tk-btn-green:hover { background: #2d9649; }
    .tk-summary-list { margin-top: 10px; }
    .tk-summary-item { background: #fff; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; border-left: 3px solid #4285f4; line-height: 1.5; }
    .tk-summary-empty { text-align: center; color: #999; padding: 20px 0; }

    /* 翻译面板 */
    .tk-translate-area { width: 100%; min-height: 80px; border: 1px solid #ddd; border-radius: 8px; padding: 8px; font-size: 13px; resize: vertical; font-family: inherit; }
    .tk-translate-row { display: flex; gap: 6px; margin-top: 8px; }
    .tk-btn-sm { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .tk-result { background: #fff; border-radius: 8px; padding: 10px; margin-top: 10px; border: 1px solid #e8e8e8; line-height: 1.6; font-size: 13px; }
    .tk-result-label { font-size: 11px; color: #888; margin-bottom: 4px; }
    .tk-translate-tip { font-size: 11px; color: #999; margin-top: 6px; }

    /* 比价面板 */
    .tk-compare-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tk-compare-head span { font-size: 13px; font-weight: 600; color: #e65100; }
    .tk-compare-actions { display: flex; gap: 4px; }
    .tk-mini-btn { font-size: 11px; padding: 3px 8px; border: none; border-radius: 5px; cursor: pointer; }
    .tk-compare-add { background: #ff6b35; color: #fff; }
    .tk-compare-clear { background: #f0f0f0; color: #666; }
    .tk-compare-summary { background: #fff; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid #ffe0cc; }
    .tk-compare-best { font-size: 12px; color: #2e7d32; font-weight: 600; margin-bottom: 2px; }
    .tk-compare-diff { font-size: 11px; color: #e65100; }
    .tk-compare-list { max-height: 280px; overflow-y: auto; }
    .tk-compare-empty { font-size: 12px; color: #999; display: block; padding: 12px 0; text-align: center; }
    .tk-compare-item { background: #fff; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; border: 1px solid #f0e0d0; }
    .tk-compare-item.best { border-color: #4caf50; background: #f1f8e9; }
    .tk-compare-title { font-size: 12px; font-weight: 500; color: #333; margin-bottom: 2px; line-height: 1.3; }
    .tk-compare-badge { display: inline-block; background: #4caf50; color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-right: 4px; }
    .tk-compare-meta { font-size: 10px; color: #999; margin-bottom: 4px; }
    .tk-compare-price { font-size: 18px; font-weight: 700; color: #e65100; margin-bottom: 6px; }
    .tk-compare-btns { display: flex; gap: 6px; }
    .tk-open-btn, .tk-del-btn { font-size: 11px; padding: 3px 10px; border: none; border-radius: 5px; cursor: pointer; }
    .tk-open-btn { background: #e3f2fd; color: #1565c0; }
    .tk-del-btn { background: #ffebee; color: #c62828; }
    .tk-loading { text-align: center; color: #999; padding: 20px; }

    .tk-footer { text-align: center; color: #bbb; font-size: 10px; padding: 12px; }
  </style>
</head>
<body>
  <div class="tk-header">
    <h1>🔧 极光工具箱</h1>
    <p>比价 · 总结 · 翻译 三合一</p>
  </div>

  <div class="tk-tabs">
    <div class="tk-tab active" data-panel="summary">📋 总结</div>
    <div class="tk-tab" data-panel="translate">🌐 翻译</div>
    <div class="tk-tab" data-panel="compare">⚖️ 比价</div>
  </div>

  <!-- 网页总结 -->
  <div class="tk-panel active" id="panel-summary">
    <div class="tk-summary-title">总结当前网页的核心要点</div>
    <button class="tk-btn tk-btn-primary" id="btn-summarize">📋 总结当前页</button>
    <div class="tk-summary-list" id="summaryList">
      <div class="tk-summary-empty">点击上方按钮，一键提取网页核心要点</div>
    </div>
  </div>

  <!-- 中英翻译 -->
  <div class="tk-panel" id="panel-translate">
    <textarea class="tk-translate-area" id="translateInput" placeholder="输入或粘贴要翻译的文字，支持中英互译"></textarea>
    <div class="tk-translate-row">
      <button class="tk-btn-sm tk-btn-primary" id="btn-translate-auto">🌐 自动翻译</button>
      <button class="tk-btn-sm tk-btn-green" id="btn-translate-zh">中→英</button>
      <button class="tk-btn-sm" id="btn-translate-en" style="background:#fbbc05;color:#fff;">英→中</button>
    </div>
    <div class="tk-result" id="translateResult" style="display:none;">
      <div class="tk-result-label">翻译结果</div>
      <div id="translateResultText"></div>
    </div>
    <div class="tk-translate-tip">💡 在网页上选中文字会自动出现翻译按钮</div>
  </div>

  <!-- 商品比价 -->
  <div class="tk-panel" id="panel-compare">
    <div class="tk-compare-head">
      <span>商品比价</span>
      <div class="tk-compare-actions">
        <button class="tk-mini-btn tk-compare-add" id="btn-compare-add">➕ 当前页</button>
        <button class="tk-mini-btn tk-compare-clear" id="btn-compare-clear">清空</button>
      </div>
    </div>
    <div class="tk-compare-summary" id="compareSummary" style="display:none;"></div>
    <div class="tk-compare-list" id="compareList">
      <span class="tk-compare-empty">在商品页点"⚖️ 加入比价"，或点"➕ 当前页"添加</span>
    </div>
  </div>

  <div class="tk-footer">极光工具箱 · 数据均保存在本地 · 不上传</div>

  <script src="translator.js"></script>
  <script src="summary.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
